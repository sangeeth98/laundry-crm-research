[project]
name = "video-pipeline"
version = "0.1.0"
description = "YouTube Video & UI Screen Harvester for Laundry CRM Competitive Research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "pydantic>=2.10.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
video-pipeline = "video_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

